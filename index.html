<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarbonMap Campus | Giriş</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="is-unauthenticated" data-app-mode="multipage" data-page="login">
  <section id="loginPage" class="login-page" aria-label="Kullanıcı giriş sayfası">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo login-logo-image-wrap"><img class="login-logo-img" src="assets/carbonmap-campus-logo.png" alt="CarbonMap Campus logosu" /></div>
        <div>
          <p class="eyebrow">İdari Personel Girişi</p>
          <h1>CarbonMap Campus</h1>
          <p>Kampüs karbon verilerini yönetmek için giriş yapın.</p>
        </div>
      </div>
      <form id="loginForm" class="login-form">
        <label>Kullanıcı E-posta<input id="loginEmail" type="email" placeholder="ornek@universite.edu.tr" autocomplete="username" required /></label>
        <label>Şifre<input id="loginPassword" type="password" placeholder="Şifrenizi girin" autocomplete="current-password" required /></label>
        <button class="btn btn-primary" type="submit">Giriş Yap</button>
        <button class="btn btn-ghost" id="demoLoginBtn" type="button">Demo Girişi</button>
        <button class="btn btn-ghost register-toggle-btn" id="showRegisterBtn" type="button">Yeni Kullanıcı Kaydı</button>
      </form>
      <form id="registerForm" class="register-panel" hidden>
        <p class="register-panel-title">Kayıt Bilgileri</p>
        <label>Ad Soyad<input id="registerFullName" type="text" placeholder="Adınızı ve soyadınızı girin" autocomplete="name" /></label>
        <label>Kullanıcı Adı<input id="registerUsername" type="text" placeholder="Kullanıcı adınızı belirleyin" autocomplete="username" /></label>
        <label>E-posta<input id="registerEmail" type="email" placeholder="ornek@universite.edu.tr" autocomplete="email" /></label>
        <label>Şifre<input id="registerPassword" type="password" placeholder="Girişte kullanacağınız şifreyi belirleyin" autocomplete="new-password" /></label>
        <label>Şifre Tekrar<input id="registerPasswordConfirm" type="password" placeholder="Şifrenizi tekrar girin" autocomplete="new-password" /></label>
        <button class="btn btn-primary" type="submit">Kaydı Tamamla</button>
        <p class="register-message" id="registerMessage" aria-live="polite"></p>
      </form>
      <p class="login-hint">Demo sürümünde gerçek sunucu kimlik doğrulaması yerine tarayıcı içinde giriş akışı simülasyonu kullanılır.</p>
    </div>
  </section>
  <script>
    const AUTH_KEY = "carbonMapCampusLoggedIn";
    const REGISTERED_USERS_KEY = "carbonMapCampusRegisteredUsers";
    const OLD_REGISTERED_USER_KEY = "carbonMapCampusRegisteredUser";
    const DEMO_EMAIL = "idari.personel@carbonmap.edu.tr";
    const DEMO_PASSWORD = "demo123";

    if (localStorage.getItem(AUTH_KEY) === "true") window.location.replace("campus-map.html");

    function readRegisteredUsers() {
      try {
        const users = JSON.parse(localStorage.getItem(REGISTERED_USERS_KEY) || "[]");
        if (Array.isArray(users)) return users;
      } catch (error) {
        console.warn("Kayıtlı kullanıcılar okunamadı:", error);
      }

      try {
        const oldUser = JSON.parse(localStorage.getItem(OLD_REGISTERED_USER_KEY) || "null");
        if (oldUser?.email) return [oldUser];
      } catch (error) {
        console.warn("Eski kullanıcı kaydı okunamadı:", error);
      }

      return [];
    }

    function saveRegisteredUsers(users) {
      localStorage.setItem(REGISTERED_USERS_KEY, JSON.stringify(users));
    }

    function login(email = DEMO_EMAIL, password = DEMO_PASSWORD) {
      const cleanEmail = email?.trim().toLowerCase();
      if (!cleanEmail || !password) {
        alert("Giriş yapmak için e-posta ve şifre alanlarını doldurun.");
        return;
      }

      const isDemoUser = cleanEmail === DEMO_EMAIL && password === DEMO_PASSWORD;
      const registeredUser = readRegisteredUsers().find((user) =>
        user.email?.toLowerCase() === cleanEmail && user.password === password
      );

      if (!isDemoUser && !registeredUser) {
        alert("E-posta veya şifre hatalı. Kayıt olduysanız kayıt sırasında belirlediğiniz şifreyle giriş yapın.");
        return;
      }

      localStorage.setItem(AUTH_KEY, "true");
      localStorage.setItem("carbonMapCampusActiveUser", JSON.stringify(
        registeredUser || {
          fullName: "Demo Kullanıcı",
          username: "demo",
          email: DEMO_EMAIL
        }
      ));
      window.location.href = "campus-map.html";
    }

    document.getElementById("loginForm")?.addEventListener("submit", (event) => {
      event.preventDefault();
      login(document.getElementById("loginEmail")?.value, document.getElementById("loginPassword")?.value);
    });

    document.getElementById("demoLoginBtn")?.addEventListener("click", () => {
      document.getElementById("loginEmail").value = DEMO_EMAIL;
      document.getElementById("loginPassword").value = DEMO_PASSWORD;
      login(DEMO_EMAIL, DEMO_PASSWORD);
    });

    document.getElementById("showRegisterBtn")?.addEventListener("click", () => {
      const panel = document.getElementById("registerForm");
      if (!panel) return;
      panel.hidden = !panel.hidden;
      if (!panel.hidden) document.getElementById("registerFullName")?.focus();
    });

    document.getElementById("registerForm")?.addEventListener("submit", (event) => {
      event.preventDefault();

      const fullName = document.getElementById("registerFullName")?.value?.trim();
      const username = document.getElementById("registerUsername")?.value?.trim();
      const email = document.getElementById("registerEmail")?.value?.trim().toLowerCase();
      const password = document.getElementById("registerPassword")?.value;
      const passwordConfirm = document.getElementById("registerPasswordConfirm")?.value;
      const message = document.getElementById("registerMessage");

      function showRegisterMessage(text, type) {
        if (!message) return;
        message.textContent = text;
        message.className = `register-message ${type}`;
      }

      if (!fullName || !username || !email || !password || !passwordConfirm) {
        showRegisterMessage("Kayıt için ad soyad, kullanıcı adı, e-posta ve şifre alanlarını doldurun.", "error");
        return;
      }

      if (password.length < 6) {
        showRegisterMessage("Şifre en az 6 karakter olmalıdır.", "error");
        return;
      }

      if (password !== passwordConfirm) {
        showRegisterMessage("Şifreler birbiriyle eşleşmiyor.", "error");
        return;
      }

      const users = readRegisteredUsers();
      const existingIndex = users.findIndex((user) =>
        user.email?.toLowerCase() === email || user.username?.toLowerCase() === username.toLowerCase()
      );

      const newUser = {
        fullName,
        username,
        email,
        password,
        createdAt: new Date().toISOString()
      };

      if (existingIndex >= 0) {
        users[existingIndex] = newUser;
      } else {
        users.push(newUser);
      }

      saveRegisteredUsers(users);
      localStorage.removeItem(OLD_REGISTERED_USER_KEY);

      document.getElementById("loginEmail").value = email;
      document.getElementById("loginPassword").value = password;

      showRegisterMessage("Kayıt oluşturuldu. Artık bu e-posta ve şifreyle giriş yapabilirsiniz.", "success");
    });
  </script>
</body>
</html>
